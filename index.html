 r.onresult=ev=>{const sp=ev.results[0][0].transcript,w=s=>nz(s).replace(/'/g,'').replace(/[^a-z0-9 ]/g,'').split(' ').filter(Boolean),t=w(e.phrase),s=w(sp);
  answer(e,sp,t.filter(x=>s.includes(x)).length/t.length>=.75&&s.length<=t.length*1.5)};
 r.onerror=()=>toast('No se detectó audio. Intenta otra vez.');toast('Escuchando… habla ahora.');r.start();
}
function beep(ok){try{const c=beep.c=beep.c||new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?660:200;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.15)}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.add('hide'),3200)}

function ask(m,f){$('dm').textContent=m;$('dlg').classList.remove('hide');$('dn').onclick=()=>$('dlg').classList.add('hide');$('dy').onclick=()=>{$('dlg').classList.add('hide');f()}}
function cert(){
 const a=S.a.exam,ok=AUTO.filter(e=>a[e.id]?.ok===true).length,n=Object.keys(a).length,sc=(ok/AUTO.length*10).toFixed(1),t=S.t.exam,fast=t<300,
 pend=ALL.filter(e=>a[e.id]&&a[e.id].ok===null),code=hs(S.st.name+'|'+ok+'|'+t+'|'+JSON.stringify(a)).toString(16).toUpperCase().padStart(8,'0'),
 tm=Math.floor(t/60)+'m '+t%60+'s',st=(b,y,x)=>`<td>${b?'✓ '+y:'⚠️ '+x}</td>`;
 $('cp').innerHTML=`<div style="text-align:center"><small>COMPROBANTE DEL EXAMEN</small><h2 style="margin:4px 0">Inglés III · 3er Parcial 2026B</h2></div>
 <table><tr><td>Alumno</td><td><b>${esc(S.st.name)}</b></td></tr><tr><td>Plantel</td><td>${esc(S.st.school)}</td></tr><tr><td>Grado y grupo</td><td>${esc(S.st.grade)} · ${esc(S.st.group)}</td></tr><tr><td>Fecha de registro</td><td>${esc(S.st.at)}</td></tr></table>
 ${fast?'<div class="fb no"><b>⚠️ Alerta:</b> tiempo activo menor a 5 minutos. Requiere validación del docente.</div>':''}
 <div class="grid2" style="margin:10px 0"><div class="c"><small>Respondidos</small><h3 style="margin:0">${n} / ${ALL.length}</h3></div><div class="c"><small>Calificación automática</small><h3 style="margin:0">${sc} / 10</h3></div><div class="c"><small>Tiempo activo</small><h3 style="margin:0">${tm}</h3></div><div class="c"><small>Pendientes de revisión</small><h3 style="margin:0">${pend.length}</h3></div></div>
 <table><tr><th>Criterio</th><th>Estado</th></tr><tr><td>Entrega completa</td>${st(n==ALL.length,'Cumplido','Faltan '+(ALL.length-n))}</tr><tr><td>Calificación ≥ 6.0</td>${st(sc>=6,'Aprobado','Deficiente')}</tr><tr><td>Tiempo activo ≥ 5 min</td>${st(!fast,'Congruente','Muy rápido')}</tr><tr><td>Revisión docente</td>${st(!pend.length,'Sin pendientes',pend.length+' por revisar')}</tr></table>
 ${pend.length?'<h4>Respuestas para revisión docente</h4><ul>'+pend.map(e=>`<li><b>${e.s}:</b> ${esc(e.type=='free'?a[e.id].v:e.prompt+' — '+a[e.id].v)}</li>`).join('')+'</ul>':''}
 <p><small>Código de verificación: <b>${code}</b></small></p>
 <div class="grid2" style="margin-top:36px;text-align:center"><div style="border-top:1px solid #888">Firma del alumno</div><div style="border-top:1px solid #888">Firma del docente</div></div>`;
 $('sd0').innerHTML='';
 if(SHEET_URL){const b=h('button','g','Enviar a mi docente');b.onclick=()=>fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({name:S.st.name,school:S.st.school,group:S.st.group,date:S.st.at,score:sc,correct:ok,answered:n,seconds:t,pending:pend.length,code,open:pend.map(e=>e.id+': '+a[e.id].v)})}).then(()=>toast('Resultados enviados ✓')).catch(()=>toast('No se pudo enviar. Imprime el comprobante.'));$('sd0').append(b)}
 $('cm').classList.remove('hide');
}
if(S)init();
</script></body></html>
